name: Lua validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 validation tool
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Compile all tracked Lua
        run: git ls-files -z '*.lua' | xargs -0 -r -n 1 luac5.1 -p
      - name: Validate runtime manifest
        run: lua5.1 Tools/check.lua
      - name: Validate catalog and run regression tests
        run: lua5.1 tests/test_catalog.lua
      - name: Validate comparison and eligibility logic
        run: lua5.1 tests/test_comparison.lua
      - name: Validate probe manifest and API failure paths
        run: |
          lua5.1 Tools/check.lua Tools/WanderfulProbe/WanderfulProbe.toc
          lua5.1 tests/test_probe_manifest.lua
          lua5.1 tests/test_probe_measurements.lua
          lua5.1 tests/test_probe_module.lua
      - name: Real-host integration (local checkout only)
        env:
          FOREVERPROBE_OPTIONAL: "1"
        run: lua5.1 tests/test_probe_host.lua
      - name: Parse developer PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in @("Tools/deploy.ps1", "tests/run.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Verify invalid runtime Lua is rejected
        shell: bash
        run: |
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          printf 'local =\n' > "$fixture/Invalid.lua"
          printf 'Invalid.lua\n' > "$fixture/Invalid.toc"
          if lua5.1 Tools/check.lua "$fixture/Invalid.toc"; then
            echo 'ERROR: invalid Lua passed validation'
            exit 1
          fi
